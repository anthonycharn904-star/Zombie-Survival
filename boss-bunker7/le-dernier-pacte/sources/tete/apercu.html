<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Tête du Septième — aperçu</title>
<style>body{margin:0;background:#0b0c0e;color:#ccc;font:13px monospace}#ui{position:fixed;left:8px;top:8px}</style>
<script src="../../jeep/t128/node_modules/three/build/three.min.js"></script>
<script src="out/boss-tete.js"></script>
</head><body><div id="ui"></div>
<script>
// Visionneur de contrôle (Three.js r128) : décode BOSS_B7_TETE exactement comme le décrit le contrat
// (out/CONTRAT.md) et l'affiche avec yeux incandescents, dents, langue et morphose de la mâchoire.
'use strict';
const D = window.BOSS_B7_TETE;
const W = 520, H = 640;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c0e);
const camera = new THREE.PerspectiveCamera(22, W / H, 0.01, 10);

// ---- décodage (extrait minimal repris dans CONTRAT.md)
function b64bytes(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function decodeTete(D) {
  const nv = D.nv, bb = D.bbox;
  const q = new Uint16Array(b64bytes(D.pos).buffer), nq = new Int8Array(b64bytes(D.nrm).buffer), uq = new Uint16Array(b64bytes(D.uv).buffer);
  const iq = nv < 65536 ? new Uint16Array(b64bytes(D.idx).buffer) : new Uint32Array(b64bytes(D.idx).buffer);
  const pos = new Float32Array(nv * 3), nrm = new Float32Array(nv * 3), uv = new Float32Array(nv * 2);
  for (let i = 0; i < nv; i++) {
    for (let k = 0; k < 3; k++) pos[i * 3 + k] = bb[k] + (bb[k + 3] - bb[k]) * q[i * 3 + k] / 65535;
    const nx = nq[i * 3] / 127, ny = nq[i * 3 + 1] / 127, nz = nq[i * 3 + 2] / 127, l = Math.hypot(nx, ny, nz) || 1;
    nrm[i * 3] = nx / l; nrm[i * 3 + 1] = ny / l; nrm[i * 3 + 2] = nz / l;
    uv[i * 2] = uq[i * 2] / 65535; uv[i * 2 + 1] = uq[i * 2 + 1] / 65535;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('uv2', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(iq, 1));
  // morphose « bouche » : deltas relatifs (1/100 mm → m)
  const bi = nv < 65536 ? new Uint16Array(b64bytes(D.bouche.idx).buffer) : new Uint32Array(b64bytes(D.bouche.idx).buffer);
  const bd = new Int16Array(b64bytes(D.bouche.delta).buffer);
  const mo = new Float32Array(nv * 3);
  for (let j = 0; j < bi.length; j++) for (let k = 0; k < 3; k++) mo[bi[j] * 3 + k] = bd[j * 3 + k] / 100000;
  g.morphAttributes.position = [new THREE.BufferAttribute(mo, 3)];
  g.morphTargetsRelative = true;
  g.computeBoundingSphere();
  return g;
}
const TL = new THREE.TextureLoader();
const loadTex = (src, srgb) => new Promise((res) => TL.load(src, (t) => { t.encoding = srgb ? THREE.sRGBEncoding : THREE.LinearEncoding; t.anisotropy = 8; res(t); }));

let headMesh, teethLow, tongue, teethLowClosed, tongueClosed, eyeMat, headMat, lights = {};
async function build() {
  const g = decodeTete(D);
  const [alb, nor, orm, emi, oeil, oeilE] = await Promise.all([loadTex(D.tex.albedo, true), loadTex(D.tex.normal, false), loadTex(D.tex.orm, false),
    loadTex(D.tex.emission, true), loadTex(D.tex.oeil, true), loadTex(D.tex.oeilEmission, true)]);
  headMat = new THREE.MeshStandardMaterial({ map: alb, normalMap: nor, aoMap: orm, roughnessMap: orm, roughness: 1,
    metalnessMap: orm, metalness: 1,            // canal B de l'ORM : métal des agrafes (0 ailleurs)
    emissiveMap: emi, emissive: new THREE.Color(1, 1, 1), emissiveIntensity: 2.2, morphTargets: true });
  headMesh = new THREE.Mesh(g, headMat);
  headMesh.morphTargetInfluences = [0];
  scene.add(headMesh);
  // yeux : globes à projection frontale (u = 0,5 + x / 24,8 mm)
  eyeMat = new THREE.MeshStandardMaterial({ map: oeil, emissiveMap: oeilE, emissive: new THREE.Color(1, 1, 1), emissiveIntensity: 3.0, roughness: 0.25 });
  for (const c of [D.yeux.gauche, D.yeux.droit]) {
    const eg = new THREE.SphereGeometry(D.yeux.rayon, 40, 28);
    eg.rotateX(Math.PI / 2);
    const p = eg.attributes.position, u = eg.attributes.uv;
    for (let i = 0; i < p.count; i++) u.setXY(i, 0.5 + p.getX(i) / 0.0248, 0.5 + p.getY(i) / 0.0248);
    const m = new THREE.Mesh(eg, eyeMat); m.position.set(c[0], c[1], c[2]); scene.add(m);
    const halo = new THREE.PointLight(0xff3010, 0.05, 0.08); halo.position.set(c[0], c[1], c[2] + 0.012); scene.add(halo);
  }
  // dents et langue
  const mk = (obj, mat, key) => {
    const gg = new THREE.BufferGeometry();
    gg.setAttribute('position', new THREE.Float32BufferAttribute(obj[key || 'v'], 3));
    if (obj.c) { const cc = []; for (const t of obj.c) cc.push(t, t * 0.95, t * 0.82); gg.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3)); }
    gg.setIndex(obj.i); gg.computeVertexNormals();
    return new THREE.Mesh(gg, mat);
  };
  const toothMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(D.dents.couleur), vertexColors: true, roughness: 0.35 });
  const tongueMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(D.cavite.couleur), roughness: 0.3 });
  scene.add(mk(D.dents.haut, toothMat));
  teethLowClosed = mk(D.dents.bas, toothMat); teethLow = mk(D.dents.bas, toothMat, 'vOuvert');
  tongueClosed = mk(D.cavite, tongueMat); tongue = mk(D.cavite, tongueMat, 'vOuvert');
  scene.add(teethLowClosed, teethLow, tongueClosed, tongue);
  // éclairage « boss » : lumière froide + contre-jour rouge, ambiance faible
  lights.amb = new THREE.HemisphereLight(0x6a7890, 0x140808, 0.35); scene.add(lights.amb);
  lights.key = new THREE.DirectionalLight(0xb8c8ff, 1.6); lights.key.position.set(0.9, 2.3, 1.4); lights.key.target.position.set(0, 1.62, 0); scene.add(lights.key, lights.key.target);
  lights.rim = new THREE.DirectionalLight(0xff2a10, 2.4); lights.rim.position.set(-1.1, 1.9, -1.3); lights.rim.target.position.set(0, 1.62, 0); scene.add(lights.rim, lights.rim.target);
  lights.rim2 = new THREE.DirectionalLight(0xff3a18, 1.2); lights.rim2.position.set(1.2, 1.5, -1.0); lights.rim2.target.position.set(0, 1.62, 0); scene.add(lights.rim2, lights.rim2.target);
  lights.neutral = new THREE.DirectionalLight(0xffffff, 0); lights.neutral.position.set(0.2, 1.9, 1.5); lights.neutral.target.position.set(0, 1.6, 0); scene.add(lights.neutral, lights.neutral.target);
  for (const k of ['key', 'rim', 'rim2', 'neutral']) lights[k].userData.base = lights[k].position.clone();
}
// option « suit » : l'éclairage tourne avec la caméra (pour regarder la texture du dos sous la même lumière que la face)
function orientLights(az) {
  for (const k of ['key', 'rim', 'rim2', 'neutral']) {
    const b = lights[k].userData.base, c = Math.cos(az), s = Math.sin(az);
    lights[k].position.set(b.x * c + b.z * s, b.y, -b.x * s + b.z * c);
  }
}
function setMouth(k) {
  headMesh.morphTargetInfluences[0] = k;
  teethLow.visible = k > 0.5; teethLowClosed.visible = !teethLow.visible;
  tongue.visible = k > 0.5; tongueClosed.visible = !tongue.visible;
}
function setLighting(mode) {
  const n = mode === 'neutre';
  lights.amb.intensity = n ? 0.8 : 0.35; lights.key.intensity = n ? 1.2 : 1.6; lights.rim.intensity = n ? 0.4 : 2.4; lights.rim2.intensity = n ? 0.2 : 1.2;
  lights.neutral.intensity = n ? 1.4 : 0;
  scene.background.set(n ? 0x34373c : 0x0b0c0e);
}
window.renderViews = async function (views, cols, opts) {
  opts = opts || {};
  if (!headMesh) await build();
  if (opts.sansNormales) { headMat.normalMap = null; headMat.needsUpdate = true; }
  if (opts.sansCouleur) { headMat.map = null; headMat.needsUpdate = true; }
  setLighting(opts.eclairage || 'boss');
  cols = cols || views.length;
  const rows = Math.ceil(views.length / cols);
  const out = document.createElement('canvas'); out.width = W * cols; out.height = H * rows;
  const ctx = out.getContext('2d');
  const O = D.origin;
  views.forEach((v, i) => {
    const [az, el, dist, dy, fov, dz, bouche, suit] = v;
    setMouth(bouche || 0);
    orientLights(suit ? az : 0);
    const t = new THREE.Vector3(O[0], O[1] + (dy || 0), O[2] + (dz == null ? -0.03 : dz));
    camera.fov = fov || 22; camera.updateProjectionMatrix();
    camera.position.set(t.x + dist * Math.sin(az) * Math.cos(el), t.y + dist * Math.sin(el), t.z + dist * Math.cos(az) * Math.cos(el));
    camera.lookAt(t);
    renderer.render(scene, camera);
    ctx.drawImage(renderer.domElement, (i % cols) * W, Math.floor(i / cols) * H);
  });
  return out.toDataURL('image/png');
};
window.__ready = true;
</script></body></html>
